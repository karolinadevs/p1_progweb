<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar senha | Capítulo Livraria</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/loja.css">
</head>

<body>

  <header class="header">

    <div class="header-top">

      <a href="/" class="logo">
        <span class="logo-mark">C</span>

        <div>
          <strong>CAPÍTULO</strong>
          <small>Livraria</small>
        </div>
      </a>


      <form
        class="search-box"
        action="/busca.html"
      >
        <input
          type="text"
          name="q"
          placeholder="Busque por título, autor ou gênero..."
        >

        <button type="submit">
          🔍
        </button>
      </form>


      <a
        href="/login.html"
        class="user-icon"
        title="Minha conta"
      >
        👤
      </a>

    </div>


    <nav class="menu">

      <a href="/">
        Início
      </a>

      <a href="/#livros">
        Livros
      </a>

      <a href="/cesta.html">
        Cesta
      </a>

      <a href="/login.html">
        Minha conta
      </a>

    </nav>

  </header>


  <main class="recover-container">

    <section class="recover-card">

      <h1>
        Esqueci minha senha
      </h1>

      <p>
        Informe o e-mail utilizado no cadastro para
        receber as instruções de recuperação da sua senha.
      </p>


      <form id="recuperar-form">

        <div class="form-group">

          <label for="email">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
          >

        </div>


        <button
          type="submit"
          class="button"
        >
          Enviar
        </button>

      </form>


      <div
        id="mensagem-recuperacao"
        style="
          display: none;
          margin-top: 25px;
          padding: 18px;
          background: #f1e5d4;
          border-radius: 10px;
          line-height: 1.6;
        "
      >
      </div>


      <a
        href="/login.html"
        class="back-link"
      >
        Voltar para o login
      </a>

    </section>

  </main>


  <script>

    const form =
      document.getElementById(
        "recuperar-form"
      );


    const mensagem =
      document.getElementById(
        "mensagem-recuperacao"
      );


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        mensagem.style.display =
          "block";


        mensagem.innerHTML = `
          <strong>
            Solicitação recebida!
          </strong>

          <br><br>

          Se existir uma conta cadastrada com o e-mail
          <strong>${email}</strong>,
          uma mensagem de recuperação será enviada
          para esse endereço com as instruções
          para redefinir sua senha.
        `;


        form.reset();

      }
    );

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar senha</title>

<link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="/loja.css">
</head>

<body>

  <header class="header">

    <div class="header-top">

      <a href="/" class="logo">

        <span class="logo-mark">
          C
        </span>

        <div>
          <strong>CAPÍTULO</strong>
          <small>Livraria</small>
        </div>

      </a>

      <div class="search-box">

        <input type="text" placeholder="Busque por título, autor ou gênero...">

        <button>
          🔍
        </button>

      </div>

      <a href="/login.html" class="user-icon">
        👤
      </a>

    </div>

    <nav class="menu">

      <a href="/">Início</a>
      <a href="/">Produtos</a>
      <a href="/cesta.html">Cesta</a>
      <a href="/login.html">Minha conta</a>

    </nav>

  </header>


  <main class="recover-container">

    <section class="recover-card">

      <h1>Esqueci minha senha</h1>

      <p>
        Informe o e-mail utilizado no cadastro para
        recuperar o acesso à sua conta.
      </p>

      <form>

        <div class="form-group">

          <label for="email">
            E-mail
          </label>

          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        </div>

        <button type="submit" class="button">
          Enviar
        </button>

      </form>

      <a href="/login.html" class="back-link">
        Voltar para o login
      </a>

    </section>

  </main>

</body>

</html>

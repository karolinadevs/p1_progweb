<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar conta | Capítulo Livraria</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/loja.css">
</head>

<body>

  <header class="header">

    <div class="header-top">

      <a href="/" class="logo">
        <span class="logo-mark">C</span>

        <div>
          <strong>CAPÍTULO</strong>
          <small>Livraria</small>
        </div>
      </a>


      <form
        class="search-box"
        action="/busca.html"
      >
        <input
          type="text"
          name="q"
          placeholder="Busque por título, autor ou gênero..."
        >

        <button type="submit">
          🔍
        </button>
      </form>


      <a
        href="/login.html"
        class="user-icon"
        title="Minha conta"
      >
        👤
      </a>

    </div>


    <nav class="menu">

      <a href="/">
        Início
      </a>

      <a href="/#livros">
        Livros
      </a>

      <a href="/cesta.html">
        Cesta
      </a>

      <a href="/login.html">
        Minha conta
      </a>

    </nav>

  </header>


  <main class="container">

    <section class="form-card">

      <h1>
        Criar conta
      </h1>

      <form id="cadastro-form">

        <div class="form-grid">


          <div class="form-group full">

            <label for="nome">
              Nome completo
            </label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome"
              minlength="3"
              required
            >

          </div>


          <div class="form-group full">

            <label for="email">
              E-mail
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu e-mail"
              required
            >

          </div>


          <div class="form-group">

            <label for="senha">
              Senha
            </label>

            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              minlength="6"
              required
            >

            <small>
              A senha deve ter pelo menos 6 caracteres.
            </small>

          </div>


          <div class="form-group">

            <label for="confirmar-senha">
              Confirmar senha
            </label>

            <input
              type="password"
              id="confirmar-senha"
              name="confirmar-senha"
              placeholder="Confirme sua senha"
              minlength="6"
              required
            >

          </div>


          <div class="form-group">

            <label for="cpf">
              CPF
            </label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="Somente números"
              pattern="[0-9]{11}"
              maxlength="11"
              required
            >

            <small>
              Digite os 11 números do CPF.
            </small>

          </div>


          <div class="form-group">

            <label for="telefone">
              Telefone
            </label>

            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="DDD + número"
              pattern="[0-9]{10,11}"
              maxlength="11"
              required
            >

            <small>
              Digite somente números.
            </small>

          </div>

        </div>


        <button
          type="submit"
          class="button"
        >
          Criar conta
        </button>


        <a
          href="/login.html"
          class="login-link"
        >
          Já tenho cadastro
        </a>

      </form>

    </section>

  </main>


  <script>

    const form =
      document.getElementById(
        "cadastro-form"
      );


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const nome =
          document
            .getElementById("nome")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const senha =
          document
            .getElementById("senha")
            .value;


        const confirmarSenha =
          document
            .getElementById(
              "confirmar-senha"
            )
            .value;


        const cpf =
          document
            .getElementById("cpf")
            .value
            .trim();


        const telefone =
          document
            .getElementById("telefone")
            .value
            .trim();


        if (senha !== confirmarSenha) {

          alert(
            "As senhas não coincidem."
          );

          return;

        }


        const usuarios =
          JSON.parse(
            localStorage.getItem(
              "usuarios"
            )
          ) || [];


        const emailJaExiste =
          usuarios.some(
            usuario =>
              usuario.email === email
          );


        if (emailJaExiste) {

          alert(
            "Já existe uma conta cadastrada com este e-mail."
          );

          return;

        }


        const cpfJaExiste =
          usuarios.some(
            usuario =>
              usuario.cpf === cpf
          );


        if (cpfJaExiste) {

          alert(
            "Já existe uma conta cadastrada com este CPF."
          );

          return;

        }


        const novoUsuario = {
          nome: nome,
          email: email,
          senha: senha,
          cpf: cpf,
          telefone: telefone
        };


        usuarios.push(
          novoUsuario
        );


        localStorage.setItem(
          "usuarios",
          JSON.stringify(
            usuarios
          )
        );


        alert(
          "Conta criada com sucesso!"
        );


        window.location.href =
          "/login.html";

      }
    );

  </script>

</body>

</html>
